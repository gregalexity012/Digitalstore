<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DigiStorex99</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
  <style>
    :root {
      --bg-color: #f9fafb; --surface-color: #ffffff; --text-main: #111827; --text-muted: #6b7280;
      --border-color: #e5e7eb; --primary: #000000; --primary-hover: #374151; --primary-text: #ffffff;
      --success: #10b981; --success-bg: #d1fae5; --danger: #ef4444; --danger-bg: #fee2e2; --warning: #f59e0b;
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
      --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1); --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1);
    }
    [data-theme="dark"] {
      --bg-color: #0f172a; --surface-color: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8;
      --border-color: #334155; --primary: #ffffff; --primary-hover: #e2e8f0; --primary-text: #0f172a;
      --success-bg: rgba(16,185,129,0.15); --danger-bg: rgba(239,68,68,0.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent;}
    
    body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
    main { flex: 1; }

    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 10000; display: none; align-items: center; justify-content: center; }
    .loading-overlay.active { display: flex; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #ffffff; font-size: 14px; font-weight: 600; text-align: center;}
    
    .notification-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); border-radius: 30px; padding: 12px 24px; color: var(--primary-text); font-size: 13px; font-weight: 600; z-index: 10001; display: none; box-shadow: var(--shadow-md); white-space: nowrap;}
    .notification-toast.show { display: block; animation: slideDown 0.3s ease; }
    .notification-toast.success { background: var(--success); color: #fff;}
    .notification-toast.error { background: var(--danger); color: #fff;}
    @keyframes slideDown { from { transform: translate(-50%, -100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    
    .btn { width: 100%; padding: 12px; background: var(--primary); color: var(--primary-text); border: none; border-radius: var(--radius-sm); font-weight: 600; font-size: 14px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s;}
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: var(--surface-color); color: var(--primary); border: 1px solid var(--border-color); }
    .btn-free { background: var(--success); color: #fff; }

    .header { background: var(--surface-color); border-bottom: 1px solid var(--border-color); padding: 12px 16px; position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; justify-content: space-between; }
    .hamburger { font-size: 22px; cursor: pointer; color: var(--text-main); display: flex; align-items: center; justify-content: center; width: 36px; height: 36px;}
    .brand-name { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
    .header-actions { display: flex; gap: 8px; align-items: center;}
    .header-icon { width: 36px; height: 36px; background: var(--bg-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; font-size: 16px;}
    .badge { position: absolute; top: -2px; right: -2px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }

    .sidebar { position: fixed; top: 0; left: -280px; width: 260px; height: 100vh; background: var(--surface-color); border-right: 1px solid var(--border-color); padding: 70px 16px 20px; transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 999; overflow-y: auto; }
    .sidebar.active { left: 0; box-shadow: var(--shadow-xl); }
    .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); display: none; z-index: 998; }
    .sidebar-overlay.active { display: block; }
    .menu-item { padding: 12px 16px; margin-bottom: 8px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 12px; }
    .menu-item i { width: 20px; text-align: center; font-size: 16px; color: var(--text-muted);}
    .menu-item:hover { background: var(--bg-color); }
    .menu-username { padding: 16px; margin-bottom: 20px; background: var(--bg-color); border-radius: var(--radius-sm); font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 10px; }

    .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .search-wrapper { position: relative; max-width: 1200px; margin: 16px auto 0; padding: 0 16px; }
    .search-bar { width: 100%; padding: 12px 40px 12px 16px; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-main); font-size: 14px; outline: none; }
    .search-icon { position: absolute; right: 30px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    
    .main-tabs { display: flex; gap: 8px; margin-bottom: 16px; background: var(--surface-color); padding: 4px; border-radius: var(--radius-md); border: 1px solid var(--border-color); }
    .main-tab-btn { flex: 1; padding: 10px; border: none; border-radius: var(--radius-sm); background: transparent; color: var(--text-muted); font-weight: 600; cursor: pointer; font-size: 13px;}
    .main-tab-btn.active { background: var(--bg-color); color: var(--primary); box-shadow: var(--shadow-sm); }

    .filter-bar { display: flex; overflow-x: auto; scrollbar-width: none; gap: 8px; margin-bottom: 16px; padding-bottom: 4px; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-btn { padding: 6px 14px; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 30px; color: var(--text-muted); font-weight: 600; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .filter-btn.active { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }
    
    .products-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    @media (min-width: 768px) { .products-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; } }
    @media (min-width: 1024px) { .products-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    
    .product-card { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 8px; cursor: pointer; display: flex; flex-direction: column; position: relative; }
    .product-badge { position: absolute; top: 16px; right: 16px; background: var(--success); color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 800; z-index: 2;}
    .pin-badge { position: absolute; top: -8px; left: -8px; background: var(--warning); color: #fff; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; z-index: 2; box-shadow: var(--shadow-sm); }
    .product-cat-tag { display: inline-block; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-muted); padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; margin-bottom: 6px; width: fit-content; text-transform: uppercase;}
    
    .product-image-wrapper { width: 100%; aspect-ratio: 1 / 1; border-radius: var(--radius-sm); overflow: hidden; background: var(--bg-color); margin-bottom: 12px; display: flex; align-items: center; justify-content: center; }
    .product-image { width: 100%; height: 100%; object-fit: contain; padding: 0px;}
    
    .product-info { display: flex; flex-direction: column; flex-grow: 1; }
    .product-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .product-price-section { margin-top: auto; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;}
    .product-price-original { text-decoration: line-through; color: var(--text-muted); font-size: 11px; }
    .product-price-discount { color: var(--primary); font-weight: 800; font-size: 15px; }

    .cart-sidebar { position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100vh; background: var(--surface-color); z-index: 1001; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; box-shadow: -5px 0 15px rgba(0,0,0,0.1); }
    .cart-sidebar.active { right: 0; }
    .cart-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border-color); }
    .cart-title { font-size: 16px; font-weight: 700; }
    .cart-close { cursor: pointer; color: var(--text-muted); font-size: 20px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--bg-color); border-radius: 50%;}
    .cart-items-container { flex: 1; overflow-y: auto; padding: 16px; }
    .cart-item { display: flex; gap: 12px; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); }
    .cart-item-image { width: 60px; height: 60px; object-fit: contain; border-radius: var(--radius-sm); background: var(--bg-color); }
    .cart-item-details { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .cart-item-title { font-size: 13px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cart-item-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .cart-item-price { color: var(--primary); font-weight: 800; font-size: 14px; }
    .cart-item-remove { color: var(--danger); font-size: 11px; font-weight: 700; cursor: pointer; padding: 4px 8px; background: var(--danger-bg); border-radius: 4px; }
    .cart-footer { padding: 16px; border-top: 1px solid var(--border-color); background: var(--bg-color); }
    .cart-total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 16px; font-weight: 800; color: var(--text-main); }

    .footer{ margin-top:50px; padding:30px 20px; text-align:center; background:var(--surface-color); border-top:1px solid var(--border-color); }
    .footer-btn{ display:inline-flex; align-items:center; gap:8px; text-decoration:none; background:var(--primary); color:var(--primary-text); padding:14px 28px; border-radius:12px; font-size:15px; font-weight:700; transition:.3s; }
    .footer-btn:hover{ opacity:.9; }
    .footer-text{ margin-top:15px; color:var(--text-muted); font-size:13px; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 2000; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    
    /* 📱 MODAL MOBILE UI FIX: Height 100dvh for dynamic browser bars */
    #productModal, #checkoutModal { padding: 0; align-items: flex-start; }
    #productModal .modal-content, #checkoutModal .modal-content { 
        background: var(--surface-color); 
        width: 100vw; 
        height: 100dvh; /* Mobile Default Fix */
        max-width: 100vw; 
        max-height: 100dvh; 
        border-radius: 0; 
        position: relative; 
        display: flex; 
        flex-direction: column; 
        overflow: hidden; 
        animation: slideUp 0.3s ease; 
        margin: 0; 
    }
    
    #authModal .modal-content { background: var(--surface-color); width: 100%; max-width: 400px; max-height: 90vh; border-radius: 16px; position: relative; display: flex; flex-direction: column; overflow: hidden; animation: scaleUp 0.2s ease; margin: 20px;}

    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .modal-scrollable { overflow-y: auto; flex: 1; padding-bottom: 20px; }
    
    /* 📱 MODAL FOOTER FIX: Sticky at bottom, won't hide under scroll */
    .modal-footer { 
        padding: 16px; 
        background: var(--surface-color); 
        border-top: 1px solid var(--border-color); 
        display: flex; 
        gap: 10px; 
        z-index: 100; 
        box-shadow: 0 -4px 15px rgba(0,0,0,0.05); 
        margin-top: auto; 
        position: sticky; 
        bottom: 0; 
        width: 100%; 
    }
    
    .modal-hero-image { width: 100%; height: 40vh; object-fit: contain; background: var(--bg-color); aspect-ratio: auto;}
    
    .modal-body { padding: 20px 20px 0 20px; }
    .modal-close-float { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; cursor: pointer; z-index: 10; }
    
    .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 12px; line-height: 1.3; }
    .modal-description { font-size: 14px; color: var(--text-muted); line-height: 1.5; white-space: pre-wrap; }
    
    .modal-price-box { display: flex; align-items: center; padding: 12px; background: var(--bg-color); border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-bottom: 16px;}
    
    .coupon-input-wrapper { display: flex; gap: 8px; }
    
    #couponInput { flex: 1; padding: 14px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-sm); outline: none; text-transform: uppercase; color: #9ca3af !important; font-weight: 500; font-size: 14px; }
    #couponInput::placeholder { color: #cbd5e1; }
    
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; margin-bottom: 4px; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;}
    .input-group input { width: 100%; padding: 14px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-sm); outline: none; font-size: 14px; color: var(--text-main);}
    
    .order-card { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 12px; }
    .order-image { width: 48px; height: 48px; border-radius: var(--radius-sm); object-fit: contain; background: var(--bg-color); border: 1px solid var(--border-color); }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loadingOverlay">
    <div><div class="loading-spinner"></div><div class="loading-text" id="loadingText">Processing...</div></div>
  </div>
  <div class="notification-toast" id="notificationToast"></div>

  <!-- HEADER -->
  <header class="header">
    <div style="display:flex; align-items:center; gap:8px;">
        <div class="hamburger" onclick="window.toggleMenu()"><i class="fas fa-bars"></i></div>
        <div class="brand-name">DigiStorex99</div>
    </div>
    <div class="header-actions">
      <div class="header-icon" onclick="window.toggleTheme()"><i class="fas fa-moon" id="themeIcon"></i></div>
      <div class="header-icon" onclick="window.toggleCart()"><i class="fas fa-shopping-bag"></i><span class="badge" id="cartBadge" style="display: none;">0</span></div>
    </div>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="window.toggleMenu()"></div>
  <aside class="sidebar" id="sidebar"><div id="menuContent"></div></aside>

  <!-- CART -->
  <aside class="cart-sidebar" id="cartSidebar">
    <div class="cart-header"><div class="cart-title">Your Cart</div><div class="cart-close" onclick="window.toggleCart()"><i class="fas fa-times"></i></div></div>
    <div class="cart-items-container" id="cartItems"></div>
    <div class="cart-footer" id="cartFooter" style="display: none;">
      <div class="cart-total-row"><span>Total</span><span id="cartTotalAmount">₹0</span></div>
      <button class="btn" onclick="window.checkoutCart()">Proceed to Checkout</button>
    </div>
  </aside>

  <main>
    <div class="search-wrapper">
      <input type="text" class="search-bar" id="searchBar" placeholder="Search products..." oninput="window.applyFilter()">
      <i class="fas fa-search search-icon"></i>
    </div>
    <div class="container">
      <div class="main-tabs">
          <button class="main-tab-btn active" id="tabStore" onclick="window.switchMainTab('store')"><i class="fas fa-store"></i> Store</button>
          <button class="main-tab-btn" id="tabPurchases" onclick="window.switchMainTab('purchases')"><i class="fas fa-layer-group"></i> My Purchases</button>
      </div>

      <!-- STORE -->
      <div id="storeView">
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="All" onclick="window.setCategoryFilter('All', this)">All</button>
            <button class="filter-btn" data-filter="Ebook" onclick="window.setCategoryFilter('Ebook', this)">Ebooks</button>
            <button class="filter-btn" data-filter="Reels Bundle" onclick="window.setCategoryFilter('Reels Bundle', this)">Reels</button>
            <button class="filter-btn" data-filter="Course" onclick="window.setCategoryFilter('Course', this)">Courses</button>
            <button class="filter-btn" data-filter="Others" onclick="window.setCategoryFilter('Others', this)">Others</button>
        </div>
        <div id="productsGrid" class="products-grid"></div>
      </div>
      
      <!-- PURCHASES -->
      <div id="purchasesView" style="display: none;"><div id="purchasesList"></div></div>
    </div>
  </main>
  
  <footer class="footer">
    <a href="about.html" class="footer-btn">
        <i class="fas fa-info-circle"></i>
        About Us
    </a>
    <p class="footer-text">
        © 2026 DigiStorex99. All Rights Reserved.
    </p>
  </footer>

  <!-- PRODUCT MODAL -->
  <div id="productModal" class="modal">
    <div class="modal-content">
      <div class="modal-close-float" onclick="window.closeModal('productModal')"><i class="fas fa-times"></i></div>
      <div class="modal-scrollable">
        <img id="modalImage" class="modal-hero-image" src="">
        <div class="modal-body">
          <h2 id="modalTitle" class="modal-title"></h2>
          <div class="modal-price-box">
              <div><span id="modalPriceOriginal" style="text-decoration:line-through; color:var(--text-muted); margin-right:8px; font-size: 13px;"></span><span id="modalPriceDiscount" style="font-size:24px; font-weight:800; color:var(--primary);"></span></div>
          </div>
          <p id="modalDescription" class="modal-description"></p>
        </div>
      </div>
      <div class="modal-footer" id="modalButtonGroup"></div>
    </div>
  </div>

  <!-- CHECKOUT MODAL -->
  <div id="checkoutModal" class="modal">
    <div class="modal-content">
      <div class="modal-close-float" style="background:var(--bg-color); color:var(--text-main);" onclick="window.closeModal('checkoutModal')"><i class="fas fa-times"></i></div>
      <div class="modal-scrollable" style="padding: 24px; padding-top: 60px;">
        <h2 style="margin-bottom:24px; font-size: 22px; font-weight: 800;">Checkout</h2>
        <div id="checkoutItems" style="background:var(--bg-color); padding:16px; border-radius:12px; margin-bottom:24px; font-size: 14px;"></div>
        
        <div style="margin-bottom: 24px;">
          <div id="appliedCouponDisplay" style="display:none; justify-content:space-between; padding:12px 16px; background:var(--success-bg); color:var(--success); border-radius:8px; margin-bottom:16px; font-weight:bold; font-size: 14px;">
              <span id="couponCodeText"></span> <i class="fas fa-times-circle" style="cursor:pointer; font-size: 18px;" onclick="window.removeCoupon()"></i>
          </div>
          <div id="couponInputSection" class="coupon-input-wrapper">
            <input type="text" id="couponInput" placeholder="Enter Discount Code">
            <button class="btn" style="width: auto; padding: 0 24px;" onclick="window.applyCoupon()">Apply</button>
          </div>
        </div>

        <div style="border-top:1px dashed var(--border-color); padding-top:20px; margin-bottom:24px;">
          <div style="display:flex; justify-content:space-between; margin-bottom:12px; color:var(--text-muted); font-size: 15px;"><span>Subtotal</span> <span id="checkoutSubtotal">₹0</span></div>
          <div id="discountRow" style="display:none; justify-content:space-between; margin-bottom:12px; color:var(--success); font-size: 15px; font-weight: 600;"><span>Discount</span> <span id="checkoutDiscount">-₹0</span></div>
          <div style="display:flex; justify-content:space-between; font-size:22px; font-weight:800; margin-top:16px; padding-top:16px; border-top:1px solid var(--border-color);"><span>Total Pay</span> <span id="checkoutTotal">₹0</span></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" style="padding: 16px; font-size: 16px;" onclick="window.proceedToPayment()"><i class="fas fa-lock"></i> Pay Securely via UPI</button>
      </div>
    </div>
  </div>

  <!-- AUTH MODAL -->
  <div id="authModal" class="modal">
    <div class="modal-content" style="padding: 24px;">
      <div class="modal-close-float" style="background:var(--bg-color); color:var(--text-main); top: 16px; right: 16px;" onclick="window.closeModal('authModal')"><i class="fas fa-times"></i></div>
      <div class="modal-scrollable" style="padding-bottom: 0;">
        <h2 id="authTitle" style="text-align:center; margin-bottom:20px; font-size: 20px; font-weight: 800;">Welcome Back</h2>
        <div id="loginForm">
          <div class="input-group"><label>Email Address</label><input type="email" id="loginEmail"></div>
          <div class="input-group"><label>Password</label><input type="password" id="loginPassword"></div>
          <button class="btn" style="margin-top:10px;" onclick="window.loginUser()">Sign In</button>
          <p style="text-align:center; margin-top:20px; font-size:13px;">Don't have an account? <span style="color:var(--text-main); font-weight:bold; cursor:pointer;" onclick="window.switchToSignup()">Sign up</span></p>
        </div>
        <div id="signupForm" style="display:none;">
          <div class="input-group"><label>Full Name</label><input type="text" id="signupName"></div>
          <div class="input-group"><label>Email Address</label><input type="email" id="signupEmail"></div>
          <div class="input-group"><label>Password</label><input type="password" id="signupPassword"></div>
          <button class="btn" style="margin-top:10px;" onclick="window.signupUser()">Create Account</button>
          <p style="text-align:center; margin-top:20px; font-size:13px;">Already have an account? <span style="color:var(--text-main); font-weight:bold; cursor:pointer;" onclick="window.switchToLogin()">Sign in</span></p>
        </div>
      </div>
    </div>
  </div>

  <!-- FIREBASE SCRIPTS -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCimIxZ2CwQn-FOETa7HoFpksbORIkgKjY",
      authDomain: "coursera-48548.firebaseapp.com",
      databaseURL: "https://coursera-48548-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    window.auth = firebase.auth(); 
    window.db = firebase.database();

    window.currentUser = null; window.allProducts = []; window.cart = []; 
    window.currentFilter = 'All'; window.appliedCoupon = null;

    window.auth.onAuthStateChanged((user) => {
      window.currentUser = user; 
      window.updateMenu(); 
      window.loadProducts(); 
      window.loadCartFromStorage();
      if(user) window.checkPendingPayments();
    });

    window.toggleTheme = function() {
        const html = document.documentElement; const icon = document.getElementById('themeIcon');
        if (html.getAttribute('data-theme') === 'dark') { html.setAttribute('data-theme', 'light'); localStorage.setItem('theme', 'light'); icon.className = 'fas fa-moon'; } 
        else { html.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); icon.className = 'fas fa-sun'; }
    }
    document.addEventListener('DOMContentLoaded', () => { if(savedTheme === 'dark') { document.getElementById('themeIcon').className = 'fas fa-sun'; } });

    window.showLoading = function(t='Processing...') { document.getElementById('loadingText').textContent=t; document.getElementById('loadingOverlay').classList.add('active'); }
    window.hideLoading = function() { document.getElementById('loadingOverlay').classList.remove('active'); }
    window.showNotification = function(m, t='success') { const n = document.getElementById('notificationToast'); n.textContent=m; n.className=`notification-toast show ${t}`; setTimeout(()=>n.classList.remove('show'), 3000); }
    window.formatCurrency = function(a) { return '₹' + parseFloat(a).toLocaleString('en-IN'); }
    window.escapeHtml = function(t) { if(!t) return''; const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
    window.toggleMenu = function() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('sidebarOverlay').classList.toggle('active'); }
    window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); }

    window.switchMainTab = function(tab) {
      document.getElementById('tabStore').classList.remove('active'); document.getElementById('tabPurchases').classList.remove('active');
      document.getElementById('storeView').style.display = 'none'; document.getElementById('purchasesView').style.display = 'none';
      if (tab === 'store') { document.getElementById('tabStore').classList.add('active'); document.getElementById('storeView').style.display = 'block'; } 
      else {
        if (!window.currentUser) { window.showAuth(); window.showNotification("Sign in required", "error"); window.switchMainTab('store'); return; }
        document.getElementById('tabPurchases').classList.add('active'); document.getElementById('purchasesView').style.display = 'block'; window.renderPurchasesList();
      }
    }

    window.updateMenu = function() {
      const menu = document.getElementById('menuContent');
      if (window.currentUser) {
        menu.innerHTML = `<div class="menu-username"><div style="width:40px; height:40px; border-radius:50%; background:var(--primary); color:var(--primary-text); display:flex; align-items:center; justify-content:center; font-weight:800; font-size: 16px;">${(window.currentUser.displayName||window.currentUser.email).charAt(0).toUpperCase()}</div><div><div style="font-size:14px;">${window.escapeHtml(window.currentUser.displayName||'User')}</div><div style="font-size:11px; font-weight:normal; color:var(--text-muted);">${window.escapeHtml(window.currentUser.email)}</div></div></div><div class="menu-item" onclick="window.toggleMenu(); window.switchMainTab('store')"><i class="fas fa-store"></i> Store</div><div class="menu-item" onclick="window.toggleMenu(); window.switchMainTab('purchases')"><i class="fas fa-layer-group"></i> My Purchases</div><div class="menu-item" style="color:var(--danger); margin-top:20px;" onclick="window.logoutUser()"><i class="fas fa-sign-out-alt"></i> Sign Out</div>`;
      } else {
        menu.innerHTML = `<div class="menu-item" onclick="window.toggleMenu(); window.switchMainTab('store')"><i class="fas fa-store"></i> Store</div><div class="menu-item" style="background:var(--primary); color:var(--primary-text); justify-content:center; margin-top:20px;" onclick="window.showAuth()">Sign In</div>`;
      }
    }

    window.setCategoryFilter = function(f, btnElem) {
      window.currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btnElem.classList.add('active');
      window.applyFilter();
    }

    window.applyFilter = function() {
        let filtered = window.allProducts;
        if (window.currentFilter !== 'All') filtered = filtered.filter(p => p.category === window.currentFilter);
        const q = document.getElementById('searchBar').value.toLowerCase();
        if (q) filtered = filtered.filter(p => (p.title||'').toLowerCase().includes(q));

        filtered.sort((a, b) => {
            const hasRankA = a.rank !== undefined && a.rank !== null && a.rank !== "";
            const hasRankB = b.rank !== undefined && b.rank !== null && b.rank !== "";
            if (hasRankA && hasRankB) return Number(a.rank) - Number(b.rank);
            if (hasRankA && !hasRankB) return -1; 
            if (!hasRankA && hasRankB) return 1;  
            const dateA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
            const dateB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
            return dateB - dateA; 
        });
        window.displayProducts(filtered);
    }

    window.displayProducts = function(products) {
      const grid = document.getElementById('productsGrid'); grid.innerHTML = '';
      if(products.length === 0) { grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-box-open" style="font-size: 40px; color: var(--border-color); margin-bottom: 10px;"></i><h3>No Products Found</h3></div>`; return; }
      products.forEach(p => {
        const isFree = parseFloat(p.discountedPrice) === 0;
        const catTag = (p.category && p.category !== 'All') ? `<div class="product-cat-tag">${window.escapeHtml(p.category)}</div>` : '';
        const pinBadge = (p.rank !== undefined && p.rank !== null && p.rank !== "") ? `<div class="pin-badge"><i class="fas fa-thumbtack"></i></div>` : '';
        grid.innerHTML += `
          <div class="product-card" onclick="window.showProductDetail('${p.id}')">
            ${pinBadge}
            ${isFree ? `<div class="product-badge">FREE</div>` : ''}
            <div class="product-image-wrapper"><img src="${window.escapeHtml(p.imageUrl)}" class="product-image" onerror="this.src='https://via.placeholder.com/400'"></div>
            <div class="product-info">
                ${catTag}
                <div class="product-title">${window.escapeHtml(p.title || 'Untitled')}</div>
                <div class="product-price-section">
                <span class="product-price-discount">${isFree ? 'Free' : window.formatCurrency(p.discountedPrice)}</span>
                ${!isFree && p.realPrice ? `<span class="product-price-original">${window.formatCurrency(p.realPrice)}</span>` : ''}
                </div>
                <button class="btn ${isFree ? 'btn-free' : ''}" style="pointer-events:none; padding: 10px; font-size: 13px;">Get It Now</button>
            </div>
          </div>`;
      });
    }

    // Dynamic URL Check & Load
    window.loadProducts = async function() {
      if(window.allProducts.length === 0) window.showLoading();
      window.db.ref('products').once('value').then(s => {
          if(s.exists()){
              const data = s.val();
              window.allProducts = Object.keys(data).map(key => ({ id: key, ...data[key] }));
              window.applyFilter();

              // URL ROUTING LOGIC
              const path = window.location.pathname.replace('/', '');
              const queryParams = new URLSearchParams(window.location.search);
              const productNum = parseInt(path) || parseInt(queryParams.get('id'));

              if (productNum && !isNaN(productNum) && productNum > 0) {
                  const oldestFirst = [...window.allProducts].sort((a, b) => {
                      const dateA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
                      const dateB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
                      return dateA - dateB; 
                  });
                  
                  const targetProduct = oldestFirst[productNum - 1];
                  
                  if (targetProduct) {
                      window.showProductDetail(targetProduct.id);
                  } else {
                      window.showNotification("Product not found!", "error");
                  }
              }
          }
          window.hideLoading();
      }).catch(e => { window.hideLoading(); });
    }

    window.showProductDetail = async function(id) {
      window.showLoading();
      try {
          const s = await window.db.ref(`products/${id}`).once('value'); 
          window.hideLoading();
          
          if (s.exists()) {
            const p = { id, ...s.val() }; window.currentProduct = p;
            let purchased = false;
            
            if(window.currentUser) { 
                const ps = await window.db.ref(`users/${window.currentUser.uid}/purchases`).once('value'); 
                if(ps.exists()) purchased = Object.values(ps.val()).some(x=>x.productId===id); 
            }
            
            document.getElementById('modalImage').src = p.imageUrl || 'https://via.placeholder.com/600';
            document.getElementById('modalTitle').textContent = p.title || 'Untitled';
            document.getElementById('modalDescription').textContent = p.description || '';
            const isFree = parseFloat(p.discountedPrice) === 0;
            document.getElementById('modalPriceOriginal').textContent = isFree ? '' : (p.realPrice ? window.formatCurrency(p.realPrice) : '');
            document.getElementById('modalPriceDiscount').textContent = isFree ? 'Free' : window.formatCurrency(p.discountedPrice);
            
            const bg = document.getElementById('modalButtonGroup');
            if(purchased) bg.innerHTML = `<button class="btn btn-free" style="flex:1;" onclick="window.closeModal('productModal'); window.switchMainTab('purchases');">Open in Purchases</button>`;
            else if(isFree) bg.innerHTML = `<button class="btn btn-free" style="flex:1;" onclick="window.open('${p.downloadLink}', '_blank')">Get It Now (Free)</button>`;
            else bg.innerHTML = `<button class="btn btn-secondary" style="flex:1;" onclick="window.addToCart()">Add to Cart</button><button class="btn" style="flex:1;" onclick="window.buyNow()">Get It Now</button>`;
            document.getElementById('productModal').classList.add('active');
          }
      } catch(e){ window.hideLoading(); window.showNotification('Error loading product details', 'error'); }
    }

    window.loadCartFromStorage = function() { window.cart = JSON.parse(localStorage.getItem('cart') || '[]'); window.updateCartUI(); }
    window.saveCartToStorage = function() { localStorage.setItem('cart', JSON.stringify(window.cart)); }
    window.toggleCart = function() { document.getElementById('cartSidebar').classList.toggle('active'); }
    window.removeFromCart = function(i) { window.cart.splice(i, 1); window.saveCartToStorage(); window.updateCartUI(); }
    
    window.addToCart = function() { window.cart.push({ id: window.currentProduct.id, title: window.currentProduct.title, price: window.currentProduct.discountedPrice, image: window.currentProduct.imageUrl }); window.saveCartToStorage(); window.updateCartUI(); window.showNotification('Added to cart!'); window.closeModal('productModal'); window.toggleCart(); }
    window.buyNow = function() { window.cart = [{ id: window.currentProduct.id, title: window.currentProduct.title, price: window.currentProduct.discountedPrice, image: window.currentProduct.imageUrl }]; window.saveCartToStorage(); window.updateCartUI(); window.closeModal('productModal'); window.checkoutCart(); }

    window.updateCartUI = function() {
      const div = document.getElementById('cartItems'); const badge = document.getElementById('cartBadge'); let t = 0; div.innerHTML = '';
      if(window.cart.length === 0) { div.innerHTML = `<div class="empty-state"><h3>Cart Empty</h3></div>`; document.getElementById('cartFooter').style.display='none'; badge.style.display='none'; return; }
      window.cart.forEach((item, i) => {
        t += parseFloat(item.price);
        div.innerHTML += `<div class="cart-item"><img src="${window.escapeHtml(item.image)}" class="cart-item-image" onerror="this.src='https://via.placeholder.com/70'"><div class="cart-item-details"><div class="cart-item-title">${window.escapeHtml(item.title)}</div><div class="cart-item-bottom"><div class="cart-item-price">${window.formatCurrency(item.price)}</div><div class="cart-item-remove" onclick="window.removeFromCart(${i})">Remove</div></div></div></div>`;
      });
      document.getElementById('cartTotalAmount').textContent = window.formatCurrency(Math.round(t)); 
      document.getElementById('cartFooter').style.display = 'block';
      badge.textContent = window.cart.length; badge.style.display = 'flex';
    }

    window.applyCoupon = async function() {
      const code = document.getElementById('couponInput').value.trim().toUpperCase(); if(!code) return window.showNotification('Enter code','error');
      window.showLoading('Applying...');
      try {
        const s = await window.db.ref('coupons').once('value'); window.hideLoading();
        if(!s.exists()) return window.showNotification('Invalid coupon','error');
        
        let found = null, cId = null;
        for(const [id, c] of Object.entries(s.val())) { if(c.code === code) { found = c; cId = id; break; } }
        
        if(!found || !found.isActive) return window.showNotification('Invalid or inactive code','error');
        
        const sub = window.cart.reduce((sum, i) => sum + parseFloat(i.price), 0);
        if(found.minAmount > 0 && sub < found.minAmount) return window.showNotification(`Min purchase: ₹${found.minAmount}`,'error');
        
        const baseSubtotal = sub + 1;
        let d = found.discountType === 'percentage' ? (baseSubtotal * found.discountValue)/100 : found.discountValue;
        if(found.discountType==='percentage' && found.maxDiscount>0 && d>found.maxDiscount) d = found.maxDiscount;
        
        d = Math.round(d);
        window.appliedCoupon = { id: cId, code: found.code, discount: d }; 
        window.updateCheckoutTotals();
        document.getElementById('couponInputSection').style.display='none'; document.getElementById('couponCodeText').textContent=found.code; document.getElementById('appliedCouponDisplay').style.display='flex';
      } catch(e) { window.hideLoading(); window.showNotification('Error','error'); }
    }
    
    window.removeCoupon = function() { window.appliedCoupon = null; document.getElementById('couponInput').value=''; document.getElementById('appliedCouponDisplay').style.display='none'; document.getElementById('couponInputSection').style.display='flex'; window.updateCheckoutTotals(); }

    window.updateCheckoutTotals = function() {
      const sub = window.cart.reduce((sum, i) => sum + parseFloat(i.price), 0); 
      const roundedSub = Math.round(sub);
      document.getElementById('checkoutSubtotal').textContent = window.formatCurrency(roundedSub);
      
      if(window.appliedCoupon) { 
          document.getElementById('discountRow').style.display='flex'; 
          document.getElementById('checkoutDiscount').textContent = `-${window.formatCurrency(window.appliedCoupon.discount)}`; 
          
          let total = Math.round(Math.max(0, (roundedSub + 1) - window.appliedCoupon.discount)) - 1;
          if(total < 0) total = 0;
          
          document.getElementById('checkoutTotal').textContent = window.formatCurrency(total); 
      }
      else { 
          document.getElementById('discountRow').style.display='none'; 
          document.getElementById('checkoutTotal').textContent = window.formatCurrency(roundedSub); 
      }
    }

    window.checkoutCart = function() {
      if(!window.currentUser) { window.showAuth(); return; } if(window.cart.length===0) return; document.getElementById('cartSidebar').classList.remove('active');
      const div = document.getElementById('checkoutItems'); div.innerHTML = '';
      window.cart.forEach(i => { div.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:8px; font-weight:600; font-size:13px;"><span>${window.escapeHtml(i.title)}</span><span>${window.formatCurrency(i.price)}</span></div>`; });
      window.removeCoupon(); window.updateCheckoutTotals(); document.getElementById('checkoutModal').classList.add('active');
    }

    window.proceedToPayment = async function() {
      const sub = window.cart.reduce((sum, i) => sum + parseFloat(i.price), 0); 
      const roundedSub = Math.round(sub); 
      const d = window.appliedCoupon ? window.appliedCoupon.discount : 0; 
      
      let tot = roundedSub;
      if (window.appliedCoupon) {
          tot = Math.round(Math.max(0, (roundedSub + 1) - d)) - 1;
          if(tot < 0) tot = 0;
      }
      
      if(tot <= 0) return window.showNotification("Total is 0. Use Free Download.", "error");
      window.showLoading('Redirecting to Payment...');
      try {
        const zapId = "ORD_" + Date.now() + "_" + Math.floor(Math.random()*1000);
        const oRef = window.db.ref('orders').push(); const oId = oRef.key;
        
        await oRef.set({ orderId: oId, zapOrderId: zapId, userId: window.currentUser.uid, items: window.cart, couponUsed: window.appliedCoupon?window.appliedCoupon.code:null, discountAmount: d, totalAmount: tot, status: 'pending', createdAt: new Date().toISOString() });
        localStorage.setItem('pendingZapOrder', zapId); localStorage.setItem('pendingFbOrder', oId);
        
        const res = await fetch('https://pay.zapupi.com/api/create-order', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ zap_key:"zap213b31e2e4477c1b3e53031d838a6325", order_id:zapId, amount:tot.toString(), customer_mobile:"9999999999", remark:"Store Purchase", success_url:window.location.href, failed_url:window.location.href }) });
        const result = await res.json();
        
        if(result.status==="success" || result.payment_url) { window.cart=[]; window.saveCartToStorage(); window.location.href=result.payment_url; }
        else { window.hideLoading(); window.showNotification("Gateway Error","error"); }
      } catch(e) { window.hideLoading(); window.showNotification("Error","error"); }
    }

    window.checkPendingPayments = async function() {
        const zId = localStorage.getItem('pendingZapOrder'); const fId = localStorage.getItem('pendingFbOrder');
        if(zId && fId) {
            window.showLoading('Verifying payment...');
            try {
                const res = await fetch('https://pay.zapupi.com/api/order-status', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ zap_key:"zap213b31e2e4477c1b3e53031d838a6325", order_id:zId }) });
                const data = await res.json();
                if(data.status==="success" && data.data.status==="Success") {
                    await window.db.ref(`orders/${fId}`).update({ status: 'confirmed' });
                    const oSnap = await window.db.ref(`orders/${fId}`).once('value');
                    
                    if(oSnap.exists()) { 
                        for(const item of oSnap.val().items) { 
                            await window.db.ref(`users/${window.currentUser.uid}/purchases/${fId}_${item.id}`).set({ orderId:fId, productId:item.id, purchasedAt:new Date().toISOString() }); 
                        } 
                    }
                    window.showNotification('Payment Successful!'); setTimeout(()=>{window.hideLoading(); window.switchMainTab('purchases');}, 1000);
                } else {
                    window.showNotification('Payment failed', 'error');
                }
            } catch(e){} localStorage.removeItem('pendingZapOrder'); localStorage.removeItem('pendingFbOrder'); window.hideLoading(); 
        }
    }

    window.renderPurchasesList = async function() {
      const list = document.getElementById('purchasesList'); 
      list.innerHTML = `<div class="empty-state"><h3>Loading your purchases...</h3></div>`;
      try {
        const snap = await window.db.ref(`users/${window.currentUser.uid}/purchases`).once('value'); 
        if(snap.exists()) {
          let accumulatedHtml = '';
          for(const [k, v] of Object.entries(snap.val())) {
             const pSnap = await window.db.ref(`products/${v.productId}`).once('value');
             if(pSnap.exists()) {
                 const p = pSnap.val();
                 accumulatedHtml += `<div class="order-card"><div style="display:flex; gap:12px; align-items:center;"><img src="${window.escapeHtml(p.imageUrl)}" class="order-image" onerror="this.src='https://via.placeholder.com/64'"><div style="flex:1;"><div style="font-weight:700; font-size: 13px; margin-bottom:4px;">${window.escapeHtml(p.title)}</div><div style="font-size:11px; font-weight: 600; color:var(--success); background: var(--success-bg); padding: 2px 6px; border-radius: 4px; display: inline-block;">Lifetime Access</div></div></div><a href="${window.escapeHtml(p.downloadLink)}" target="_blank" class="btn btn-secondary" style="padding:10px; text-decoration:none; font-size: 13px;">Open / Download</a></div>`;
             }
          }
          list.innerHTML = accumulatedHtml || `<div class="empty-state"><h3>No Purchases Yet</h3></div>`;
        } else {
          list.innerHTML = `<div class="empty-state"><h3>No Purchases Yet</h3></div>`;
        }
      } catch(e){ list.innerHTML = `<div class="empty-state">Error loading purchases</div>`; }
    }

    window.showAuth = function() { window.toggleMenu(); document.getElementById('authTitle').innerText='Sign In'; document.getElementById('loginForm').style.display='block'; document.getElementById('signupForm').style.display='none'; document.getElementById('authModal').classList.add('active'); }
    window.switchToSignup = function() { document.getElementById('authTitle').innerText='Create Account'; document.getElementById('loginForm').style.display='none'; document.getElementById('signupForm').style.display='block'; }
    window.switchToLogin = function() { document.getElementById('authTitle').innerText='Sign In'; document.getElementById('signupForm').style.display='none'; document.getElementById('loginForm').style.display='block'; }
    
    window.loginUser = async function() { const e=document.getElementById('loginEmail').value, p=document.getElementById('loginPassword').value; if(!e||!p)return; window.showLoading(); try{ await window.auth.signInWithEmailAndPassword(e, p); window.closeModal('authModal'); }catch(err){ window.showNotification(err.message.replace('Firebase: ',''), 'error'); } window.hideLoading(); }
    window.signupUser = async function() { const n=document.getElementById('signupName').value, e=document.getElementById('signupEmail').value, p=document.getElementById('signupPassword').value; if(!n||!e||!p)return; window.showLoading(); try{ const c = await window.auth.createUserWithEmailAndPassword(e, p); await c.user.updateProfile({displayName:n}); window.closeModal('authModal'); }catch(err){ window.showNotification(err.message.replace('Firebase: ',''), 'error'); } window.hideLoading(); }
    window.logoutUser = async function() { window.showLoading(); await window.auth.signOut(); window.hideLoading(); window.toggleMenu(); window.switchMainTab('store'); }
    window.onclick = e => { if(e.target.classList.contains('modal')) e.target.classList.remove('active'); }
  </script>
</body>
