  <style>
    /* PREMIUM GREEN THEME */
    :root {
      --bg-main: #f6fbf8; --bg-surface: #ffffff; --text-main: #0f172a; --text-muted: #475569;
      --primary: #047857; --primary-hover: #059669; --border-color: #d1fae5;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
      --card-shadow-hover: 0 12px 25px -5px rgba(4, 120, 87, 0.15), 0 8px 10px -6px rgba(4, 120, 87, 0.1);
      --header-bg: rgba(255, 255, 255, 0.85);
    }
    [data-theme="dark"] {
      --bg-main: #050505; --bg-surface: #0a140f; --text-main: #f8fafc; --text-muted: #94a3b8;
      --primary: #10b981; --primary-hover: #34d399; --border-color: #064e3b;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.6);
      --card-shadow-hover: 0 12px 25px -5px rgba(16, 185, 129, 0.25);
      --header-bg: rgba(5, 5, 5, 0.85);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* 🟢 LAG FIX: Fast Transition on Body 🟢 */
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; transition: background-color 0.15s ease-out, color 0.15s ease-out; will-change: background-color; }
    main { flex: 1; }

    /* LOADING SPINNER */
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main); z-index: 10000; display: none; align-items: center; justify-content: center; opacity: 0.95;}
    .loading-overlay.active { display: flex; }
    .loading-spinner { width: 50px; height: 50px; border: 4px solid var(--border-color); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--text-main); font-size: 16px; font-weight: 600; text-align: center;}

    /* 🟢 LAG FIX: Removed transition from header & reduced blur 🟢 */
    .header { background: var(--header-bg); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-color); padding: 15px 24px; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
    .brand-section { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand-icon { font-size: 24px; color: var(--primary); }
    h1.brand-name { font-size: 22px; font-weight: 800; color: var(--text-main); margin: 0; }
    h1.brand-name span { color: var(--primary); }
    .theme-toggle-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: 0.3s; }
    
    /* SEARCH & FILTERS */
    .search-container { padding: 30px 20px 10px; max-width: 1200px; margin: 0 auto; }
    .search-wrapper { position: relative; max-width: 600px; margin: 0 auto; }
    .search-bar { width: 100%; padding: 15px 50px 15px 20px; background: var(--bg-surface); border: 2px solid var(--border-color); border-radius: 30px; color: var(--text-main); font-size: 16px; outline: none; box-shadow: var(--card-shadow); transition: background-color 0.15s ease-out, color 0.15s ease-out, border-color 0.3s;}
    .search-bar:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); }
    .search-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 18px;}
    
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .filter-slider { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 25px; scrollbar-width: none; }
    .filter-slider::-webkit-scrollbar { display: none; }
    .filter-btn { padding: 10px 20px; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 25px; color: var(--text-muted); font-weight: 600; cursor: pointer; white-space: nowrap; box-shadow: var(--card-shadow); transition: background-color 0.15s ease-out, color 0.15s ease-out, border-color 0.3s;}
    .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* PRODUCTS GRID */
    .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .product-card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 18px; padding: 20px; cursor: pointer; display: flex; flex-direction: column; position: relative; transition: background-color 0.15s ease-out, transform 0.3s, box-shadow 0.3s, border-color 0.3s; box-shadow: var(--card-shadow); }
    .product-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: var(--card-shadow-hover);}
    .product-badge { position: absolute; top: 15px; right: 15px; background: var(--primary); color: #fff; padding: 5px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; z-index: 2;}
    .product-cat-badge { display: inline-block; align-self: flex-start; background: var(--bg-main); color: var(--primary); padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; border: 1px solid var(--border-color); margin-bottom: 8px; text-transform: uppercase;}
    .product-image { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; background: var(--bg-main); flex-shrink: 0; }
    .product-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 50px; }
    .product-price-section { margin-bottom: 20px; display: flex; align-items: baseline; gap: 8px; flex-shrink: 0; }
    .product-price-original { text-decoration: line-through; color: var(--text-muted); font-size: 14px; }
    .product-price-discount { font-weight: 800; font-size: 20px;}
    .btn { padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; text-transform: uppercase; transition: 0.3s;}
    .btn-free-download { background: var(--text-main); color: var(--bg-surface); }

    /* FOOTER */
    .simple-footer { padding: 25px 20px; text-align: center; border-top: 1px solid var(--border-color); margin-top: 40px; font-size: 14px; color: var(--text-muted); }
    .simple-footer a { color: var(--primary); text-decoration: none; font-weight: 600; margin: 0 10px; transition: 0.3s;}
    .simple-footer a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .products-grid { gap: 10px; }
      .product-card { padding: 12px; }
      .product-image { height: 120px; margin-bottom: 10px; }
      .product-title { font-size: 14px; min-height: 40px; margin-bottom: 8px;}
      .product-price-discount { font-size: 16px; }
      .btn { padding: 10px; font-size: 12px; }
      .product-badge { padding: 3px 8px; font-size: 10px; top: 10px; right: 10px; }
      .product-cat-badge { padding: 3px 8px; font-size: 10px; margin-bottom: 6px; }
    }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loadingOverlay">

  <header class="header">

    <button class="theme-toggle-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
  </header>

  <main>
    <div class="search-container">
      <div class="search-wrapper">
        <input type="text" class="search-bar" id="searchBar" placeholder="Search for courses, ebooks, bundles..." oninput="searchProducts()">
        <i class="fas fa-search search-icon"></i>

    <div class="container">
      <div class="filter-slider" id="filterSlider">
        <button class="filter-btn active" data-filter="All" onclick="filterProducts('All')">All Items</button>

        <button class="filter-btn" data-filter="Reels Bundle" onclick="filterProducts('Reels Bundle')">Reels Bundles</button>
        <button class="filter-btn" data-filter="Course" onclick="filterProducts('Course')">Courses</button>

      <div id="productsGrid" class="products-grid"></div>
    </div>
  </main>

  <footer class="simple-footer">
    <p>
      &copy; 2026 DIGISTOREX. All rights reserved. <br><br>
      <a href="index.html">Home</a> | 
      <a href="about.html">About Us</a>
    </p>
  </footer>

  <script>
    // Theme Toggle Logic
    const themeToggleBtn = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
    }

    themeToggleBtn.addEventListener('click', () => {
      if (document.documentElement.getAttribute('data-theme') === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        themeToggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
      }
    });
  </script>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js';
    import { getDatabase, ref, get, onValue } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js';

    const firebaseConfig = { apiKey: "AIzaSyCimIxZ2CwQn-FOETa7HoFpksbORIkgKjY", authDomain: "coursera-48548.firebaseapp.com", databaseURL: "https://coursera-48548-default-rtdb.firebaseio.com", projectId: "coursera-48548", storageBucket: "coursera-48548.firebasestorage.app", messagingSenderId: "598429439493", appId: "1:598429439493:web:8eedc8465b329edd006e6c" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.allProducts = []; window.currentFilter = 'All';
    const loadingOverlay = document.getElementById('loadingOverlay');
    loadingOverlay.classList.add('active');

    // AUTO SEO INJECTOR
    function updateSEO() {
      if(window.allProducts.length === 0) return;
      const productNames = window.allProducts.map(p => p.title).join(', ');
      let metaKeywords = document.querySelector('meta[name="keywords"]');
      if (metaKeywords) {
        let currentKeywords = metaKeywords.getAttribute('content');
        if (!currentKeywords.includes(window.allProducts[0]?.title)) {
           metaKeywords.setAttribute('content', currentKeywords + ', ' + productNames);
        }
      }
    }

    onValue(ref(db, 'products'), (snapshot) => {
      if (snapshot.exists() && typeof snapshot.val() === 'object') {
        window.allProducts = Object.entries(snapshot.val()).map(([id, product]) => ({ id, ...product })).sort((a, b) => {
          const hasRankA = a.rank !== undefined && a.rank !== null && a.rank !== "";
          const hasRankB = b.rank !== undefined && b.rank !== null && b.rank !== "";
          if (hasRankA && hasRankB) return Number(a.rank) - Number(b.rank);
          if (hasRankA && !hasRankB) return -1;
          if (!hasRankA && hasRankB) return 1;
          const dateA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
          const dateB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
          if (dateB !== dateA) return dateB - dateA;
          return b.id.localeCompare(a.id);
        });
        if (window.filterProducts) window.filterProducts(window.currentFilter);
        updateSEO(); // Add titles to keywords dynamically
      }
      loadingOverlay.classList.remove('active');
    }, (error) => { loadingOverlay.classList.remove('active'); });
  </script>

  <script>
    function formatCurrency(amt) { return '₹' + parseFloat(amt).toLocaleString('en-IN'); }
    function escapeHtml(text) { if(!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

    function displayProducts(products) {
      const grid = document.getElementById('productsGrid'); grid.innerHTML = '';
      if(products.length === 0) { grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No products found.</div>'; return; }
      products.forEach(product => {
        const isFree = parseFloat(product.discountedPrice) === 0;
        const catBadge = (product.category && product.category !== 'All') ? `<div class="product-cat-badge">${escapeHtml(product.category)}</div>` : '';
        grid.innerHTML += `
          <div class="product-card" onclick="window.location.href='${escapeHtml(product.downloadLink || '#')}'">
            ${isFree ? `<div class="product-badge">FREE</div>` : ''}
            <img src="${escapeHtml(product.imageUrl)}" class="product-image" onerror="this.src='https://via.placeholder.com/400x250?text=No+Image'">
            ${catBadge}
            <div class="product-title">${escapeHtml(product.title || 'Untitled Product')}</div>
            <div class="product-price-section">
              ${!isFree && product.realPrice ? `<span class="product-price-original">${formatCurrency(product.realPrice)}</span>` : ''}
              <span class="product-price-discount">${isFree ? 'Free Download' : formatCurrency(product.discountedPrice)}</span>
            </div>
            <button class="btn ${isFree ? 'btn-free-download' : ''}" style="pointer-events:none;">
              ${isFree ? '<i class="fas fa-download"></i> Get For Free' : '<i class="fas fa-bolt"></i> Buy Now'}
            </button>
          </div>`;
      });
    }

    window.filterProducts = function filterProducts(filter) {
      window.currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`[data-filter="${filter}"]`)?.classList.add('active');
      let filtered = window.allProducts;
      if (filter !== 'All') filtered = filtered.filter(p => p.category === filter);
      displayProducts(filtered);
    }

    function searchProducts() {
      const q = document.getElementById('searchBar').value.toLowerCase();
      let filtered = window.allProducts.filter(p => (p.title||'').toLowerCase().includes(q));
      if (window.currentFilter !== 'All') filtered = filtered.filter(p => p.category === window.currentFilter);
      displayProducts(filtered);
    }
  </script>
</body>
